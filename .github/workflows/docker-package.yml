name: Docker Package

on:
    push:
        branches:
            - main
            - release-mini
        tags:
            - "v*"
        paths:
            - ".dockerignore"
            - "backend/**"
            - "requirements.txt"
            - ".github/workflows/docker-package.yml"
    workflow_dispatch:

# Serialize publishing within each branch; alpha and beta remain independent.
concurrency:
    group: docker-publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-platform-image:
        name: Build ${{ matrix.platform }} image
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      architecture: amd64
                      runner: ubuntu-24.04
                    - platform: linux/arm64
                      architecture: arm64
                      runner: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Normalize image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
              run: echo "name=ghcr.io/${REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                        type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/main' }}
                        type=raw,value=beta,enable=${{ github.ref == 'refs/heads/release-mini' }}
                        type=ref,event=tag
                        type=sha,prefix=sha-,format=short
                  flavor: latest=false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate settings_local.py
              run: cp backend/backend/settings_prod.py backend/backend/settings_local.py

            - name: Build and push platform image
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./backend/Dockerfile
                  provenance: false
                  platforms: ${{ matrix.platform }}
                  outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend-${{ github.ref_name }}-${{ matrix.architecture }}
                  cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}-${{ matrix.architecture }}

            # Pass immutable digests from this run to the manifest job.
            - name: Export digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                    mkdir -p "${RUNNER_TEMP}/digests"
                    touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: backend-digests-${{ matrix.architecture }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish-manifest:
        needs: build-platform-image
        runs-on: ubuntu-24.04
        permissions:
            packages: write

        steps:
            - name: Normalize image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
              run: echo "name=ghcr.io/${REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  flavor: latest=false
                  tags: |
                        type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/main' }}
                        type=raw,value=beta,enable=${{ github.ref == 'refs/heads/release-mini' }}
                        type=ref,event=tag
                        type=sha,prefix=sha-,format=short

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: backend-digests-*
                  merge-multiple: true

            - name: Create and publish multi-platform manifest
              id: manifest
              working-directory: ${{ runner.temp }}/digests
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                    mapfile -t tags <<< "$TAGS"
                    tag_args=()
                    for tag in "${tags[@]}"; do
                        tag_args+=(--tag "$tag")
                    done
                    sources=()
                    for digest in *; do
                        [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
                        sources+=("$IMAGE@sha256:$digest")
                    done
                    test "${#sources[@]}" -eq 2
                    docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
                    docker buildx imagetools inspect "${tags[0]}"
                    {
                        echo "### Backend image published"
                        for tag in "${tags[@]}"; do
                            printf -- '- `%s`\n' "$tag"
                        done
                    } >> "$GITHUB_STEP_SUMMARY"
