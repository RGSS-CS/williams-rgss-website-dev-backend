name: Docker Build Test

on:
  pull_request:
    paths:
      - ".github/workflows/docker-package.yml"
      - ".github/workflows/docker-build-test.yml"
      - ".dockerignore"
      - "backend/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate settings_local.py
        run: cp backend/backend/settings_dev.py backend/backend/settings_local.py

      - name: Debug Photologue migrations
        run: |
          python -m pip show django-photologue
          python -c "import photologue; print('Photologue:', photologue.__file__)"
          python -c "import photologue, pathlib; p=pathlib.Path(photologue.__file__).parent/'migrations'; print('Migrations:', p); print('\n'.join(sorted(x.name for x in p.glob('*.py')))"
          python manage.py showmigrations photologue

      - name: Run Django tests
        working-directory: ./backend
        run: python manage.py test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: backend:test
          provenance: false
          cache-from: type=gha,scope=${{ github.ref_name }}-test
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-test
