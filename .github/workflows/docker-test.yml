name: Docker Build Test

on:
  pull_request:
    paths:
      - ".github/workflows/docker-package.yml"
      - ".github/workflows/docker-build-test.yml"
      - ".dockerignore"
      - "backend/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate settings_local.py
        run: cp backend/backend/settings_dev.py backend/backend/settings_local.py

      - name: Run Django tests
        working-directory: ./backend
        run: python manage.py test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build image (no push)
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f6b30f8571c # v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: backend:test
          provenance: false
          cache-from: type=gha,scope=${{ github.ref_name }}-test
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-test
